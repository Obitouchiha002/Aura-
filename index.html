<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aura Shakti</title>
    <meta name="description" content="Aura Shakti — council, mentors, focus and simulation for a sharper mind." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      window.process = window.process || { env: {} };

      // Apply the saved theme before first paint, so light-theme users never
      // see a flash of the dark palette on load.
      (function () {
        try {
          var saved = localStorage.getItem('aura_settings');
          if (saved && JSON.parse(saved).theme === 'light') {
            document.documentElement.classList.add('light-theme');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F7F7F8');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      Boot screen.

      The native launch image cannot animate — it is a static drawable Android
      paints before the webview exists. So it does the shortest possible job:
      cover the black gap, then hand over to this, which is the same mark but
      alive. Written inline, styles and all, so it paints on the very first
      frame without waiting for the stylesheet or the bundle.
    -->
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 1024 1024" width="112" height="112">
        <defs>
          <linearGradient id="boot-lid" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#F5F5F5" stop-opacity=".6"/>
            <stop offset="50%"  stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#F5F5F5" stop-opacity=".6"/>
          </linearGradient>
        </defs>
        <g id="boot-eye">
          <path class="boot-lid"
                d="M168 512C168 512 310 286 512 286C714 286 856 512 856 512C856 512 714 738 512 738C310 738 168 512 168 512Z"
                fill="none" stroke="url(#boot-lid)" stroke-width="38" stroke-linejoin="round"/>
          <circle cx="512" cy="512" r="176" fill="#0A0A0A" stroke="#E5484D" stroke-width="34"/>
          <circle cx="512" cy="512" r="56" fill="#E5484D"/>
          <g id="boot-tomoe" fill="#E5484D">
            <circle cx="512" cy="394" r="31"/>
            <circle cx="614" cy="571" r="31"/>
            <circle cx="410" cy="571" r="31"/>
          </g>
        </g>
      </svg>
    </div>
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0A0A0A;
        transition: opacity .35s ease;
      }
      .light-theme #boot { background: #F7F7F8; }
      /* The lid is a white gradient, which is invisible on the light ground.
         CSS beats the presentation attribute, so one rule swaps it for ink. */
      .light-theme .boot-lid { stroke: #2E2E33; }
      /* The lid shuts, not the iris — squashing the whole mark reads as a
         glitch; squashing it around its own centre reads as an eye closing. */
      #boot-eye   { transform-origin: 512px 512px; animation: boot-blink 3s ease-in-out infinite; }
      #boot-tomoe { transform-origin: 512px 512px; animation: boot-turn 9s linear infinite; }
      /* The first blink lands at 0.45s — early enough that it is seen even on a
         fast boot, which is the whole point of putting it here. */
      @keyframes boot-blink {
        0%, 10%, 20%, 79%, 89%, 100% { transform: scaleY(1); }
        15%, 84%                     { transform: scaleY(.06); }
      }
      @keyframes boot-turn { to { transform: rotate(360deg); } }
      /* Honour the system setting: a pulsing mark is exactly what this is for. */
      @media (prefers-reduced-motion: reduce) {
        #boot-eye, #boot-tomoe { animation: none; }
      }
    </style>
    <script>
      // Drop the native launch image the moment this screen is on glass. The
      // bridge is injected before page scripts, so the plugin is already here;
      // on the web there is no Capacitor and the chain short-circuits.
      try { window.Capacitor && window.Capacitor.Plugins
        && window.Capacitor.Plugins.SplashScreen
        && window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
