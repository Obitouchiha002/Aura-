<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The app's own mark: the eye that watches, with a shuriken iris.
       Same glyph as the chat header and the site hero, so the launcher icon,
       the app and the website are recognisably one thing. -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="42%" r="72%">
      <stop offset="0%"  stop-color="#1A0E10"/>
      <stop offset="55%" stop-color="#0C0A0B"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E5484D" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F5F5F5" stop-opacity=".55"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#F5F5F5" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>
  <g transform="translate(512 512) scale(0.68) translate(-512 -512)">
  <circle cx="512" cy="512" r="330" fill="url(#bloom)"/>

  <!-- the almond -->
  <path d="M168 512C168 512 310 286 512 286C714 286 856 512 856 512C856 512 714 738 512 738C310 738 168 512 168 512Z"
        fill="none" stroke="url(#lid)" stroke-width="34" stroke-linejoin="round"/>

  <!-- iris -->
  <circle cx="512" cy="512" r="176" fill="#0A0A0A" stroke="#E5484D" stroke-width="30"/>
  <circle cx="512" cy="512" r="56"  fill="#E5484D"/>

  <!-- three tomoe, evenly turned -->
  <g fill="#E5484D">
    <circle cx="512" cy="394" r="31"/>
    <circle cx="614" cy="571" r="31"/>
    <circle cx="410" cy="571" r="31"/>
  </g>
  </g>
</svg>
