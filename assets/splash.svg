<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <!-- Launch image. Square on purpose: Android crops it to whatever shape the
       device is, from either edge, so anything off-centre drifts further off
       the more extreme the aspect ratio gets.

       The mark is placed by arithmetic, not by a layout engine. An earlier
       version centred an HTML wrapper around an SVG that was wider than it,
       so the wrapper was centred and the mark inside it was not — it sat
       visibly to the right on a phone. translate((2732-1024)/2) puts the
       mark's own centre on the canvas centre, and there is nothing left to
       get that wrong. -->
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F5F5F5" stop-opacity=".6"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5" stop-opacity=".6"/>
    </linearGradient>
  </defs>

  <rect width="2732" height="2732" fill="#0A0A0A"/>

  <g transform="translate(854 854)">
    <g transform="translate(512 512) scale(0.62) translate(-512 -512)">
      <path d="M168 512C168 512 310 286 512 286C714 286 856 512 856 512C856 512 714 738 512 738C310 738 168 512 168 512Z"
            fill="none" stroke="url(#lid)" stroke-width="38" stroke-linejoin="round"/>
      <circle cx="512" cy="512" r="176" fill="#0A0A0A" stroke="#E5484D" stroke-width="34"/>
      <circle cx="512" cy="512" r="56"  fill="#E5484D"/>
      <g fill="#E5484D">
        <circle cx="512" cy="394" r="31"/>
        <circle cx="614" cy="571" r="31"/>
        <circle cx="410" cy="571" r="31"/>
      </g>
    </g>
  </g>
</svg>
